  <path d="M 585 246 L 585 140" fill="none" stroke="#9ca3af" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="597" y="200" font-size="13" fill="#e8eaed">Publish (merges as Version 4)</text>
