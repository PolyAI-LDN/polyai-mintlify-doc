  <rect x="60" y="90" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="290" y="90" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="520" y="90" width="130" height="44" rx="6" fill="rgba(120,200,90,0.24)" stroke="#8ed06a" stroke-width="2"/>
  <text x="125" y="117" font-size="14" text-anchor="middle" fill="#e8eaed">Version 1</text>
  <text x="355" y="117" font-size="14" text-anchor="middle" fill="#e8eaed">Version 2</text>
  <text x="585" y="117" font-size="14" font-weight="600" text-anchor="middle" fill="#e8eaed">Version 3</text>
  <text x="524" y="150" font-size="11" text-anchor="start" fill="#a5dd85">current</text>
  <line x1="190" y1="112" x2="284" y2="112" stroke="#9ca3af" marker-end="url(#arr)"/>
  <line x1="420" y1="112" x2="514" y2="112" stroke="#9ca3af" marker-end="url(#arr)"/>
  <path d="M 585 90 C 585 54, 355 54, 355 86" fill="none" stroke="#9ca3af" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="470" y="58" font-size="13" text-anchor="middle" fill="#e8eaed">Roll back</text>

  <rect x="10" y="182" width="920" height="150" rx="8" fill="rgba(110,160,255,0.09)" stroke="rgba(110,160,255,0.32)"/>
  <text x="28" y="210" font-size="15" font-weight="600" fill="#e8eaed">Sandbox (build and test, no real connections)</text>
