<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="10" y="16" width="920" height="150" rx="8" fill="rgba(120,200,90,0.10)" stroke="rgba(120,200,90,0.35)"/>
