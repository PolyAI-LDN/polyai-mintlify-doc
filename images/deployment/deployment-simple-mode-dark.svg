<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="10" y="16" width="920" height="150" rx="8" fill="rgba(120,200,90,0.10)" stroke="rgba(120,200,90,0.35)"/>
  <text x="28" y="44" font-size="15" font-weight="600" fill="#e8eaed">Live (production traffic)</text>
  <rect x="60" y="90" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="290" y="90" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="520" y="90" width="130" height="44" rx="6" fill="rgba(120,200,90,0.24)" stroke="#8ed06a" stroke-width="2"/>
  <text x="125" y="117" font-size="14" text-anchor="middle" fill="#e8eaed">Version 1</text>
  <text x="355" y="117" font-size="14" text-anchor="middle" fill="#e8eaed">Version 2</text>
  <text x="585" y="117" font-size="14" font-weight="600" text-anchor="middle" fill="#e8eaed">Version 3</text>
  <text x="585" y="150" font-size="11" text-anchor="middle" fill="#a5dd85">current</text>
  <line x1="190" y1="112" x2="284" y2="112" stroke="#9ca3af" marker-end="url(#arr)"/>
  <line x1="420" y1="112" x2="514" y2="112" stroke="#9ca3af" marker-end="url(#arr)"/>
  <path d="M 585 90 C 585 54, 355 54, 355 86" fill="none" stroke="#9ca3af" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="470" y="58" font-size="13" text-anchor="middle" fill="#e8eaed">Roll back</text>

  <rect x="10" y="182" width="920" height="118" rx="8" fill="rgba(240,180,60,0.09)" stroke="rgba(240,180,60,0.32)"/>
  <text x="28" y="208" font-size="15" font-weight="600" fill="#e8eaed">Staging (real phone number and API connections)</text>

  <rect x="10" y="316" width="920" height="180" rx="8" fill="rgba(110,160,255,0.09)" stroke="rgba(110,160,255,0.32)"/>
  <text x="28" y="344" font-size="15" font-weight="600" fill="#e8eaed">Sandbox (build and test)</text>
  <rect x="510" y="390" width="150" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <text x="585" y="417" font-size="14" text-anchor="middle" fill="#e8eaed">Working copy</text>

  <path d="M 545 386 L 545 140" fill="none" stroke="#9ca3af" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="533" y="250" font-size="13" text-anchor="end" fill="#e8eaed">Publish (merges as Version 4)</text>
  <line x1="640" y1="386" x2="640" y2="244" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="652" y="250" font-size="13" fill="#e8eaed">Automatically in Staging,</text>
  <text x="652" y="270" font-size="13" fill="#e8eaed">so you can call it any time</text>
</svg>
