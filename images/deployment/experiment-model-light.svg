<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="10" y="16" width="920" height="268" rx="8" fill="rgba(74,160,44,0.08)" stroke="rgba(74,160,44,0.35)"/>
  <text x="28" y="44" font-size="15" font-weight="600" fill="#26282d">Live (production traffic)</text>
  <rect x="40" y="128" width="150" height="48" rx="6" fill="rgba(107,114,128,0.08)" stroke="rgba(107,114,128,0.45)"/>
  <text x="115" y="157" font-size="14" text-anchor="middle" fill="#26282d">Customer calls</text>
  <rect x="340" y="70" width="220" height="56" rx="6" fill="rgba(74,160,44,0.20)" stroke="#4a8c2c" stroke-width="2"/>
  <text x="450" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#26282d">Control</text>
  <text x="450" y="114" font-size="12" text-anchor="middle" fill="#4b5563">your current Live version</text>
  <rect x="340" y="180" width="220" height="56" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <text x="450" y="204" font-size="14" font-weight="600" text-anchor="middle" fill="#26282d">Variant</text>
  <text x="450" y="224" font-size="12" text-anchor="middle" fill="#4b5563">the Branch you are testing</text>
  <path d="M 190 146 C 260 146, 266 98, 334 98" fill="none" stroke="#6b7280" marker-end="url(#arr)"/>
  <path d="M 190 158 C 260 158, 266 208, 334 208" fill="none" stroke="#6b7280" marker-end="url(#arr)"/>
  <text x="262" y="110" font-size="13" text-anchor="middle" fill="#26282d">50%</text>
  <text x="262" y="206" font-size="13" text-anchor="middle" fill="#26282d">50%</text>
  <rect x="660" y="128" width="250" height="48" rx="6" fill="rgba(107,114,128,0.08)" stroke="rgba(107,114,128,0.45)"/>
  <text x="785" y="149" font-size="14" font-weight="600" text-anchor="middle" fill="#26282d">Pick a winner</text>
  <text x="785" y="167" font-size="12" text-anchor="middle" fill="#4b5563">it takes 100% of calls</text>
  <path d="M 560 98 C 612 98, 606 146, 654 146" fill="none" stroke="#6b7280" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M 560 208 C 612 208, 606 158, 654 158" fill="none" stroke="#6b7280" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="785" y="112" font-size="13" text-anchor="middle" fill="#26282d">End experiment</text>
  <text x="450" y="262" font-size="12" text-anchor="middle" fill="#3f7a26">Keep updating both while it runs</text>
</svg>
