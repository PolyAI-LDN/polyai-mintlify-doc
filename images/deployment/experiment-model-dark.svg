  <path d="M 190 146 C 260 146, 266 98, 334 98" fill="none" stroke="#9ca3af" marker-end="url(#arr)"/>
  <path d="M 190 158 C 260 158, 266 208, 334 208" fill="none" stroke="#9ca3af" marker-end="url(#arr)"/>
  <text x="262" y="110" font-size="13" text-anchor="middle" fill="#e8eaed">50%</text>
