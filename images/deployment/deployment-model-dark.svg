<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <rect x="10" y="16" width="920" height="150" rx="8" fill="rgba(120,200,90,0.10)" stroke="rgba(120,200,90,0.35)"/>
  <rect x="10" y="182" width="920" height="118" rx="8" fill="rgba(240,180,60,0.09)" stroke="rgba(240,180,60,0.32)"/>
  <rect x="10" y="316" width="920" height="180" rx="8" fill="rgba(110,160,255,0.09)" stroke="rgba(110,160,255,0.32)"/>
  <text x="28" y="44" font-size="15" font-weight="600" fill="#e8eaed">Live (production traffic)</text>
  <text x="28" y="208" font-size="15" font-weight="600" fill="#e8eaed">Staging (real phone number and API connections)</text>
  <text x="28" y="344" font-size="15" font-weight="600" fill="#e8eaed">Sandbox (build and test, no real connections)</text>

  <!-- Live versions -->
  <rect x="60" y="100" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="290" y="100" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="520" y="100" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <text x="125" y="127" font-size="14" text-anchor="middle" fill="#e8eaed">Version 1</text>
  <text x="355" y="127" font-size="14" text-anchor="middle" fill="#e8eaed">Version 2</text>
  <text x="585" y="127" font-size="14" text-anchor="middle" fill="#e8eaed">Version 3</text>
  <text x="585" y="160" font-size="11" text-anchor="middle" fill="#9ca3af">current</text>
  <line x1="190" y1="122" x2="284" y2="122" stroke="#9ca3af" marker-end="url(#arr)"/>
  <line x1="420" y1="122" x2="514" y2="122" stroke="#9ca3af" marker-end="url(#arr)"/>
  <path d="M 585 100 C 585 62, 355 62, 355 96" fill="none" stroke="#9ca3af" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="470" y="66" font-size="13" text-anchor="middle" fill="#e8eaed">Roll back</text>

  <!-- Staging branch -->
  <rect x="700" y="226" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <text x="765" y="253" font-size="14" text-anchor="middle" fill="#e8eaed">Branch B</text>

  <!-- Branch B and Live, one two-way connector -->
  <path d="M 765 222 L 765 176 L 620 176 L 620 150" fill="none" stroke="#9ca3af" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="775" y="196" font-size="13" fill="#e8eaed">Publish</text>

  <!-- Branch B moves in and out of Staging -->
  <line x1="765" y1="274" x2="765" y2="340" stroke="#9ca3af" stroke-dasharray="5 4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="755" y="310" font-size="13" text-anchor="end" fill="#e8eaed">Move in or out</text>

  <!-- Sandbox branch and sub-branches -->
  <rect x="460" y="380" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="700" y="356" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <rect x="700" y="424" width="130" height="44" rx="6" fill="rgba(129,140,248,0.16)" stroke="rgba(129,140,248,0.65)"/>
  <text x="525" y="407" font-size="14" text-anchor="middle" fill="#e8eaed">Branch A</text>
  <text x="765" y="383" font-size="14" text-anchor="middle" fill="#e8eaed">Sub-branch A1</text>
  <text x="765" y="451" font-size="14" text-anchor="middle" fill="#e8eaed">Sub-branch A2</text>

  <!-- One connector per Sub-branch -->
  <path d="M 594 394 C 650 394, 650 378, 696 378" fill="none" stroke="#9ca3af" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path d="M 594 410 C 650 410, 650 446, 696 446" fill="none" stroke="#9ca3af" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="620" y="484" font-size="13" text-anchor="middle" fill="#e8eaed">Create a Sub-branch, merge back</text>

  <!-- One connector between Live and Branch A -->
  <path d="M 545 150 L 545 376" fill="none" stroke="#9ca3af" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="535" y="246" font-size="13" text-anchor="end" fill="#e8eaed">Create a Branch</text>
  <text x="535" y="266" font-size="13" text-anchor="end" fill="#e8eaed">Publish (merges as Version 4)</text>
</svg>
