<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <rect x="10" y="16" width="920" height="150" rx="8" fill="rgba(140,140,160,0.07)" stroke="rgba(140,140,160,0.35)"/>
  <rect x="10" y="182" width="920" height="118" rx="8" fill="rgba(140,140,160,0.07)" stroke="rgba(140,140,160,0.35)"/>
  <rect x="10" y="316" width="920" height="180" rx="8" fill="rgba(140,140,160,0.07)" stroke="rgba(140,140,160,0.35)"/>
  <text x="28" y="44" font-size="15" font-weight="600" fill="#26282d">Live (production traffic)</text>
  <text x="28" y="208" font-size="15" font-weight="600" fill="#26282d">Staging (real phone number and API connections)</text>
  <text x="28" y="344" font-size="15" font-weight="600" fill="#26282d">Sandbox (build and test, no real connections)</text>

  <!-- Live versions -->
  <rect x="60" y="100" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <rect x="290" y="100" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <rect x="520" y="100" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <text x="125" y="127" font-size="14" text-anchor="middle" fill="#26282d">Version 1</text>
  <text x="355" y="127" font-size="14" text-anchor="middle" fill="#26282d">Version 2</text>
  <text x="585" y="127" font-size="14" text-anchor="middle" fill="#26282d">Version 3</text>
  <text x="585" y="160" font-size="11" text-anchor="middle" fill="#6b7280">current</text>
  <line x1="190" y1="122" x2="284" y2="122" stroke="#6b7280" marker-end="url(#arr)"/>
  <line x1="420" y1="122" x2="514" y2="122" stroke="#6b7280" marker-end="url(#arr)"/>
  <path d="M 585 100 C 585 62, 355 62, 355 96" fill="none" stroke="#6b7280" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="470" y="66" font-size="13" text-anchor="middle" fill="#26282d">Roll back</text>

  <!-- Staging branch -->
  <rect x="520" y="226" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <text x="585" y="253" font-size="14" text-anchor="middle" fill="#26282d">Branch B</text>

  <!-- Branch B publishes to Live -->
  <line x1="620" y1="226" x2="620" y2="150" stroke="#6b7280" marker-end="url(#arr)"/>
  <text x="630" y="192" font-size="13" fill="#26282d">Publish</text>

  <!-- Branch B moves in and out of Staging -->
  <line x1="530" y1="274" x2="530" y2="330" stroke="#6b7280" stroke-dasharray="5 4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="520" y="306" font-size="13" text-anchor="end" fill="#26282d">Move in or out</text>

  <!-- Sandbox branch and sub-branches -->
  <rect x="290" y="370" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <rect x="700" y="336" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <rect x="700" y="404" width="130" height="44" rx="6" fill="rgba(99,102,241,0.10)" stroke="rgba(99,102,241,0.55)"/>
  <text x="355" y="397" font-size="14" text-anchor="middle" fill="#26282d">Branch A</text>
  <text x="765" y="363" font-size="14" text-anchor="middle" fill="#26282d">Sub-branch A1</text>
  <text x="765" y="431" font-size="14" text-anchor="middle" fill="#26282d">Sub-branch A2</text>

  <!-- One connector per Sub-branch -->
  <path d="M 424 378 C 560 378, 560 358, 694 358" fill="none" stroke="#6b7280" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path d="M 424 406 C 560 406, 560 426, 694 426" fill="none" stroke="#6b7280" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="560" y="348" font-size="13" text-anchor="middle" fill="#26282d">Create a Sub-branch, merge back</text>

  <!-- One connector between Live and Branch A -->
  <path d="M 545 150 L 545 172 L 355 172 L 355 364" fill="none" stroke="#6b7280" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="345" y="246" font-size="13" text-anchor="end" fill="#26282d">Create a Branch</text>
  <text x="345" y="266" font-size="13" text-anchor="end" fill="#26282d">Publish (merges as Version 4)</text>
</svg>
