openapi: 3.1.0
info:
  title: PolyAI Builder MCP
  version: 1.0.0
  description: Every operation the Builder MCP (https://api.studio.poly.ai/builder-mcp and the other clusters'
    /builder-mcp listeners) exposes as a tool, drawn from the jupiter-api, sourcerer and supervisor-alerts
    public APIs and filtered to the routes published on the us-1-prod cluster. Each operation carries
    x-mcp-tool (the tool's name as MCP clients see it) and x-mcp-service (the backing service). Tool input
    schemas are the operation's parameters and request body; the gateway calls the operation on the caller's
    behalf with their API key or, over OAuth, a token exchanged for the signed-in user.
  x-mcp:
    name: builder
    listener_path: /builder-mcp
    services:
    - jupiter-api
    - sourcerer
    - supervisor-alerts
    tool_count: 131
servers:
- url: https://api.us.poly.ai
  description: prod-us cluster
- url: https://api.uk.poly.ai
  description: prod-uk cluster
- url: https://api.eu.poly.ai
  description: prod-euw cluster
- url: https://api.studio.poly.ai
  description: prod-plg cluster
security:
- polyApiKey: []
- oauth: []
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
components:
  securitySchemes:
    polyApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
    oauth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An MCP client's OAuth token for the listener, which Kong exchanges for a Platform API
        token about the user.
  schemas:
    ActiveAlertResponse:
      properties:
        alert_rule_id:
          type: string
          title: Alert Rule Id
          description: Alert rule ID
        name:
          type: string
          title: Name
          description: Alert rule name
        project_id:
          type:
          - string
          - 'null'
          title: Project Id
          description: Project ID
        metric:
          type: string
          title: Metric
          description: Metric being monitored
        operator:
          type: string
          title: Operator
          description: Comparison operator
        threshold_value:
          type: integer
          title: Threshold Value
          description: Threshold value
        window_duration:
          type: string
          title: Window Duration
          description: Window duration (5m, 10m, or 60m)
        since:
          type: string
          format: date-time
          title: Since
          description: When the alert started
        last_evaluated_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Last Evaluated At
          description: Last evaluation timestamp
        current_value:
          type:
          - integer
          - 'null'
          title: Current Value
          description: Current metric value
      type: object
      required:
      - alert_rule_id
      - name
      - metric
      - operator
      - threshold_value
      - window_duration
      - since
      title: ActiveAlertResponse
      description: 'A rule currently in the triggered state, including when it first

        crossed the threshold.'
    ActiveAlertsListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ActiveAlertResponse'
          type: array
          title: Data
          description: List of active alerts
      type: object
      required:
      - data
      title: ActiveAlertsListResponse
      description: Every rule currently in the triggered state.
    ActiveDeploymentsResponse:
      description: 'The latest deployment for each environment (sandbox, pre-release,

        live). Entries are null when no deployment exists for an environment.'
      type: object
      properties:
        activeDeployments:
          description: Latest deployment per environment (sandbox, pre-release, live). Value is null if
            no deployment exists for that environment.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DeploymentResponse'
      required:
      - activeDeployments
    AddAnnotationsBody:
      description: One or more utterance annotations to attach to a conversation.
      type: object
      properties:
        annotations:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/AnnotationItem'
      required:
      - annotations
    AgentRulesResponse:
      type: object
      properties:
        behavior:
          type: string
      required:
      - behavior
      additionalProperties: false
      description: The agent's global behavior rules text.
      title: AgentRulesResponse
    AlertMetric:
      enum:
      - turn_latency_p50
      - turn_latency_p95
      - api_errors
      - function_errors
      - call_crashes
      - call_volume
      title: AlertMetric
      description: Alert metric enum
    AlertOperator:
      enum:
      - '>'
      - <
      - '>='
      - <=
      title: AlertOperator
      description: Alert operator enum
    AlertRuleCreateRequest:
      properties:
        name:
          type: string
          title: Name
          description: Alert rule name
        project_id:
          type:
          - string
          - 'null'
          title: Project Id
          description: Project ID (optional)
        metric:
          allOf:
          - $ref: '#/components/schemas/AlertMetric'
          type: string
          description: Metric to monitor
        operator:
          allOf:
          - $ref: '#/components/schemas/AlertOperator'
          type: string
          description: Comparison operator
        threshold_value:
          type: integer
          minimum: 0.0
          title: Threshold Value
          description: Threshold value
        window_duration:
          allOf:
          - $ref: '#/components/schemas/WindowDuration'
          type: string
          description: Window duration (5m, 10m, or 60m)
        enabled:
          type: boolean
          title: Enabled
          description: Whether the alert is enabled
          default: true
      type: object
      required:
      - name
      - metric
      - operator
      - threshold_value
      - window_duration
      title: AlertRuleCreateRequest
      description: 'Fields for creating a new alert rule: which metric to watch, the

        threshold condition, and how long it must hold to fire.'
    AlertRuleListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AlertRuleResponse'
          type: array
          title: Data
          description: List of alert rules
      type: object
      required:
      - data
      title: AlertRuleListResponse
      description: Every alert rule in scope, each with its current state.
    AlertRuleResponse:
      properties:
        id:
          type: string
          title: Id
          description: 'Alert rule ID, prefixed: the same one alerts webhooks carry'
        name:
          type: string
          title: Name
          description: Alert rule name
        project_id:
          type:
          - string
          - 'null'
          title: Project Id
          description: Project ID
        metric:
          allOf:
          - $ref: '#/components/schemas/AlertMetric'
          type: string
          description: Metric being monitored
        operator:
          allOf:
          - $ref: '#/components/schemas/AlertOperator'
          type: string
          description: Comparison operator
        threshold_value:
          type: integer
          title: Threshold Value
          description: Threshold value
        window_duration:
          allOf:
          - $ref: '#/components/schemas/WindowDuration'
          type: string
          description: Window duration (5m, 10m, or 60m)
        enabled:
          type: boolean
          title: Enabled
          description: Whether the alert is enabled
        current_state:
          allOf:
          - $ref: '#/components/schemas/AlertState'
          type:
          - string
          - 'null'
          description: Current alert state
        since:
          type:
          - string
          - 'null'
          format: date-time
          title: Since
          description: When the current state started
        last_evaluated_at:
          type:
          - string
          - 'null'
          format: date-time
          title: Last Evaluated At
          description: Last evaluation timestamp
        current_value:
          type:
          - integer
          - 'null'
          title: Current Value
          description: Current metric value
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
      type: object
      required:
      - id
      - name
      - metric
      - operator
      - threshold_value
      - window_duration
      - enabled
      - created_at
      - updated_at
      title: AlertRuleResponse
      description: 'An alert rule: its trigger condition, evaluation window, and current state.'
    AlertRuleUpdateRequest:
      properties:
        name:
          type:
          - string
          - 'null'
          title: Name
          description: Alert rule name
        metric:
          allOf:
          - $ref: '#/components/schemas/AlertMetric'
          type:
          - string
          - 'null'
          description: Metric to monitor
        operator:
          allOf:
          - $ref: '#/components/schemas/AlertOperator'
          type:
          - string
          - 'null'
          description: Comparison operator
        threshold_value:
          type:
          - integer
          - 'null'
          minimum: 0.0
          title: Threshold Value
          description: Threshold value
        window_duration:
          allOf:
          - $ref: '#/components/schemas/WindowDuration'
          type:
          - string
          - 'null'
          description: Window duration (5m, 10m, or 60m)
        enabled:
          type:
          - boolean
          - 'null'
          title: Enabled
          description: Whether the alert is enabled
        project_id:
          type:
          - string
          - 'null'
          title: Project Id
          description: Project ID
      type: object
      title: AlertRuleUpdateRequest
      description: Update alert rule request (PATCH - partial updates)
    AlertState:
      enum:
      - ok
      - alert
      - no_data
      - unknown
      title: AlertState
      description: Alert state enum
    AnnotationItem:
      description: A single utterance annotation.
      type: object
      properties:
        turnId:
          description: Zero-based index of the turn
          type: integer
        role:
          description: Which side of the turn the annotation applies to
          enum:
          - user
          - agent
          type: string
        annotationType:
          description: Annotation label
          enum:
          - missing_topic
          - wrong_transcript
          - wrong_info
          type: string
      required:
      - turnId
      - role
      - annotationType
    AttributeResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      additionalProperties: false
      description: A variant attribute defined on a branch.
      title: AttributeResponse
    AudioCacheEntryResponse:
      description: A single audio cache entry in a list response.
      type: object
      properties:
        id:
          type: string
        transcript:
          description: Transcript used for cache lookup
          type: string
        cachedAt:
          description: ISO 8601 timestamp of when entry was cached
          type: string
        hitCount:
          description: Number of cache hits
          type: integer
        duration:
          description: Audio duration in seconds
          type: number
        regenerated:
          description: Whether this entry has been regenerated
          type: boolean
        provider:
          description: 'TTS provider tied to this audio cache entry. Provider is an enum that reflects
            one of our supported TTS providers: eleven_labs, google, play_ht, cartesia, hume, minimax,
            rime, poly_tts, resemble, nemo, microsoft'
          type: string
        providerVoiceId:
          description: The ID of the voice cataloged in the TTS provider's system. If your TTS provider
            is PolyAI, this will be an internally assigned voice ID. If you are using a third-party provider,
            this will be the voice ID from that provider's catalog (e.g. '21m00Tcm4TlvDq8ikWAM' for ElevenLabs,
            'en-US-Neural2-A' for Google)
          type: string
        audioFilename:
          description: Original audio filename
          type:
          - string
          - 'null'
        imported:
          description: Whether this entry was imported
          type: boolean
        languageCode:
          description: BCP-47 language code
          default: ''
          type: string
      required:
      - id
      - transcript
      - cachedAt
      - hitCount
      - duration
      - regenerated
      - provider
      - providerVoiceId
      - imported
    BatchGetConnectorsBody:
      description: Set of connector IDs to retrieve in a single call.
      type: object
      properties:
        connectorIds:
          description: List of connector IDs to retrieve
          minItems: 1
          type: array
          items:
            type: string
      required:
      - connectorIds
    BatchGetConnectorsResponse:
      description: 'Result of a batch connector lookup, partitioned into connectors that

        were found and IDs that weren''t.'
      type: object
      properties:
        found:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorResponse'
        notFound:
          type: array
          items:
            type: string
      required:
      - found
      - notFound
    BatchGetPhoneNumbersBody:
      description: Set of E.164 phone numbers to retrieve in a single call.
      type: object
      properties:
        phoneNumbers:
          description: List of phone numbers to retrieve
          minItems: 1
          type: array
          items:
            type: string
      required:
      - phoneNumbers
    BatchGetPhoneNumbersResponse:
      description: 'Result of a batch phone-number lookup, partitioned into numbers that

        were found and numbers that weren''t.'
      type: object
      properties:
        found:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberResponse'
        notFound:
          type: array
          items:
            type: string
      required:
      - found
      - notFound
    BatchUpdateConnectorItem:
      description: A single connector update within a batch update request.
      type: object
      properties:
        connectorId:
          description: Connector ID to update
          type: string
        variantId:
          description: Variant ID to assign, or null to unassign
          type:
          - string
          - 'null'
        asrLangCode:
          description: ASR language code. Also sets tts_lang_code unless voice_name is given or the connector
            already has a voice. The ASR code is copied in its TTS form (e.g. no-NO becomes nb-NO); a
            code without a region, like en, leaves tts_lang_code unchanged. A stored voice must be in
            the same language unless voice_name changes or clears it in the same request.
          type:
          - string
          - 'null'
        voiceName:
          description: Google TTS voice name; tts_lang_code is derived from its prefix. An empty string
            clears the voice.
          type:
          - string
          - 'null'
        projectId:
          description: Move connector to a different project
          type:
          - string
          - 'null'
      required:
      - connectorId
    BatchUpdateConnectorsBody:
      description: 'Ordered list of connector updates.


        Each update is applied independently — partial success is possible.'
      type: object
      properties:
        updates:
          description: List of connector updates
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/BatchUpdateConnectorItem'
      required:
      - updates
    BatchUpdateConnectorsResponse:
      description: 'Per-connector results from a batch update.


        Each entry reports success or failure independently.'
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchUpdateResultItem'
      required:
      - results
    BatchUpdateResultItem:
      description: Result of a single connector update within a batch.
      type: object
      properties:
        connectorId:
          type: string
        success:
          type: boolean
        data:
          description: Updated connector (present when success=True)
          anyOf:
          - $ref: '#/components/schemas/ConnectorResponse'
          - type: 'null'
        error:
          description: Error message (present when success=False)
          type:
          - string
          - 'null'
      required:
      - connectorId
      - success
    BulkDeleteRequest:
      description: Audio cache entry IDs to delete in a single call (max 20).
      type: object
      properties:
        ids:
          description: List of audio cache entry IDs to delete (max 20)
          minItems: 1
          maxItems: 20
          type: array
          items:
            type: string
      required:
      - ids
    BulkDeleteResponse:
      description: 'Per-entry results of a bulk delete — IDs that were deleted, and IDs

        that failed.'
      type: object
      properties:
        deleted:
          description: IDs that were successfully deleted
          type: array
          items:
            type: string
        failed:
          description: IDs that failed to delete
          type: array
          items:
            type: string
      required:
      - deleted
      - failed
    CategoriesResponse:
      description: Response for GET /builder-knowledge/categories.
      type: object
      properties:
        categories:
          description: Alphabetically sorted list of knowledge categories
          type: array
          items:
            type: string
      required:
      - categories
    ChatMetadataResponse:
      description: Metadata returned with each chat response.
      type: object
      properties:
        state:
          type: object
        currentNode:
          type: string
        nodeTrace:
          type: array
          items:
            type: string
        metrics:
          type: object
        functionEvents:
          type: array
          items: {}
        handoffDestination:
          type:
          - string
          - 'null'
        retrievedTopics:
          type:
          - array
          - 'null'
          items:
            type: string
        retrievedSources:
          type:
          - array
          - 'null'
          items:
            type: string
        citedTopic:
          type:
          - string
          - 'null'
        inFlow:
          type:
          - string
          - 'null'
        inStep:
          type:
          - string
          - 'null'
        llmRequests:
          type:
          - array
          - 'null'
          items:
            type: object
        asrLangCode:
          type:
          - string
          - 'null'
        ttsLangCode:
          type:
          - string
          - 'null'
      required:
      - state
      - currentNode
      - nodeTrace
      - metrics
      - functionEvents
    ConfigPageResponse:
      description: 'A real-time config page for one environment: its JSON Schema

        definition plus the current variable values.'
      type: object
      properties:
        clientEnv:
          description: Environment (sandbox, pre-release, live)
          type: string
        variables:
          description: Config key-value pairs
          type:
          - object
          - 'null'
        schema:
          description: JSON Schema (Draft 7) definition
          type:
          - object
          - 'null'
        lastUpdated:
          description: ISO 8601 timestamp of last update
          type:
          - string
          - 'null'
      required:
      - clientEnv
    ConnectorResponse:
      description: 'A connector: the voice, language, variant, and environment bundle

        that handles incoming calls. Multiple phone numbers can share one

        connector.'
      type: object
      properties:
        connectorId:
          description: Unique connector identifier
          type: string
        name:
          description: Connector display name
          type: string
        accountId:
          description: Account this connector belongs to
          type: string
        projectId:
          description: Project this connector belongs to
          type: string
        clientEnv:
          description: Client environment (sandbox, pre-release, live)
          type: string
        variantId:
          description: Assigned variant ID (empty string if unassigned)
          type: string
        asrLangCode:
          description: ASR language code (e.g. en-US)
          type: string
        ttsLangCode:
          description: TTS language code (e.g. en-US)
          type: string
        voiceName:
          description: Google TTS voice name (e.g. en-US-Neural2-A)
          type: string
        disableHandoff:
          description: Whether call handoff is disabled
          type: boolean
      required:
      - connectorId
      - name
      - accountId
      - projectId
      - clientEnv
      - variantId
      - asrLangCode
      - ttsLangCode
      - voiceName
      - disableHandoff
    ConnectorTokenResponse:
      description: The connector token for one client environment.
      type: object
      properties:
        clientEnv:
          description: Client environment the token routes calls to
          enum:
          - sandbox
          - pre-release
          - live
          type: string
        connectorId:
          description: ID of the connector the token belongs to
          type: string
        token:
          description: Connector token. Treat as a secret; it grants call access to this agent in this
            environment.
          type: string
      required:
      - clientEnv
      - connectorId
      - token
    ConnectorTokensResponse:
      description: Connector tokens for every client environment that has one.
      type: object
      properties:
        tokens:
          description: One entry per client environment with a connector
          type: array
          items:
            $ref: '#/components/schemas/ConnectorTokenResponse'
      required:
      - tokens
    ConversationDetailResponse:
      description: Public-facing conversation detail (includes turns, metrics).
      type: object
      properties:
        conversationId:
          type: string
        accountId:
          type: string
        projectId:
          type: string
        createdAt:
          type:
          - string
          - 'null'
        startedAt:
          type:
          - string
          - 'null'
        finishedAt:
          type:
          - string
          - 'null'
        channel:
          type:
          - string
          - 'null'
        fromNumber:
          type:
          - string
          - 'null'
        toNumber:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
        variantId:
          type:
          - string
          - 'null'
        clientEnv:
          type:
          - string
          - 'null'
        totalDuration:
          type:
          - integer
          - 'null'
        polyaiDuration:
          type:
          - integer
          - 'null'
        duration:
          type:
          - integer
          - 'null'
        inProgress:
          type:
          - boolean
          - 'null'
        handoff:
          type:
          - boolean
          - 'null'
        handoffDestination:
          type:
          - string
          - 'null'
        handoffReason:
          type:
          - string
          - 'null'
        direction:
          type:
          - string
          - 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        polyScore:
          type:
          - number
          - 'null'
        polyScoreV2:
          description: PolyScore on the 1-5 scale
          type:
          - number
          - 'null'
        customScores:
          description: Results for the project's AI Scores, sorted by name. An AI Score that was never
            run on this conversation (created after it ended, inactive at the time, or limited to other
            channels) has no entry. One that ran but was skipped or failed has an entry with that state
            and a null score
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomScoreResult'
        shortSummary:
          anyOf:
          - $ref: '#/components/schemas/ShortSummary'
          - type: 'null'
        deploymentId:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        audioUrl:
          type:
          - string
          - 'null'
        turns:
          type:
          - array
          - 'null'
          items:
            type: object
        metrics:
          type:
          - object
          - 'null'
        functionEvents:
          type:
          - object
          - 'null'
      required:
      - conversationId
      - accountId
      - projectId
    ConversationSummaryResponse:
      description: A conversation's top-level metadata, without its turn-by-turn transcript.
      type: object
      properties:
        conversationId:
          type: string
        accountId:
          type: string
        projectId:
          type: string
        createdAt:
          type:
          - string
          - 'null'
        startedAt:
          type:
          - string
          - 'null'
        finishedAt:
          type:
          - string
          - 'null'
        channel:
          type:
          - string
          - 'null'
        fromNumber:
          type:
          - string
          - 'null'
        toNumber:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
        variantId:
          type:
          - string
          - 'null'
        clientEnv:
          type:
          - string
          - 'null'
        totalDuration:
          type:
          - integer
          - 'null'
        polyaiDuration:
          type:
          - integer
          - 'null'
        duration:
          type:
          - integer
          - 'null'
        inProgress:
          type:
          - boolean
          - 'null'
        handoff:
          type:
          - boolean
          - 'null'
        handoffDestination:
          type:
          - string
          - 'null'
        handoffReason:
          type:
          - string
          - 'null'
        direction:
          type:
          - string
          - 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        polyScore:
          type:
          - number
          - 'null'
        polyScoreV2:
          description: PolyScore on the 1-5 scale
          type:
          - number
          - 'null'
        customScores:
          description: Results for the project's AI Scores, sorted by name. An AI Score that was never
            run on this conversation (created after it ended, inactive at the time, or limited to other
            channels) has no entry. One that ran but was skipped or failed has an entry with that state
            and a null score
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomScoreResult'
        shortSummary:
          anyOf:
          - $ref: '#/components/schemas/ShortSummary'
          - type: 'null'
        deploymentId:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        audioUrl:
          type:
          - string
          - 'null'
      required:
      - conversationId
      - accountId
      - projectId
    CreateAgentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        agentId:
          type: string
          pattern: ^[a-zA-Z0-9-]+$
        responseSettings:
          type: object
          properties:
