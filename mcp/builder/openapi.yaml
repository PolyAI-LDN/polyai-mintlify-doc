      description: 'Partial update to a connector.


        Only fields present in the request body are changed; absent fields are

        left alone. Pass ``null`` to clear a value explicitly.'
      type: object
      properties:
        variantId:
          description: Variant ID to assign, or null to unassign
          type:
          - string
          - 'null'
        asrLangCode:
          description: ASR language code (e.g. en-US). Also sets tts_lang_code unless voice_name is given
            or the connector already has a voice. The ASR code is copied in its TTS form (e.g. no-NO becomes
            nb-NO); a code without a region, like en, leaves tts_lang_code unchanged. A stored voice must
            be in the same language unless voice_name changes or clears it in the same request.
          type:
          - string
          - 'null'
        voiceName:
          description: Google TTS voice name (e.g. en-US-Neural2-A). tts_lang_code is auto-derived from
            the voice name prefix. Validated via TTS probe. An empty string clears the voice and leaves
            tts_lang_code unchanged.
          type:
          - string
          - 'null'
        projectId:
          description: Move connector to a different project. API key must have access to both projects.
          type:
          - string
          - 'null'
    UpdateFlowPublicBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        startStepId:
          type: string
        steps:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                - default_step
                - advanced_step
                - function_step
              name:
                type: string
              prompt:
                type: string
              position:
                type: object
                properties:
                  x:
                    type: number
                  y:
                    type: number
                required:
                - x
                - y
                additionalProperties: false
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum:
                      - exitFlowCondition
                      - noCodeStepCondition
                      - stepCondition
                      - functionStepCondition
                    label:
                      type: string
                    description:
                      type: string
                    childStepId:
                      type: string
                    requiredEntities:
                      type: array
                      items:
                        type: string
                  required:
                  - id
                  - type
                  - label
                  additionalProperties: false
              references:
                type: object
                properties:
                  entities:
                    type: object
                    additionalProperties:
                      type: boolean
                  attributes:
                    type: object
                    additionalProperties:
                      type: boolean
                  variables:
                    type: object
                    additionalProperties:
                      type: boolean
                  extractedEntities:
                    type: object
                    additionalProperties:
                      type: boolean
                  transitionFunctions:
                    type: object
                    additionalProperties:
                      type: boolean
                  globalFunctions:
                    type: object
                    additionalProperties:
                      type: boolean
                  sms:
                    type: object
                    additionalProperties:
                      type: boolean
                  handoff:
                    type: object
                    additionalProperties:
                      type: boolean
                additionalProperties: false
              function:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  latencyControl:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      randomize:
                        type: boolean
                      initialDelay:
                        type: number
                      interval:
                        type: number
                    required:
                    - enabled
                    additionalProperties: false
                required:
                - id
                - name
                - code
                additionalProperties: false
            required:
            - id
            - type
            - name
            additionalProperties: false
          description: 'Full replace semantics: when provided, this array becomes the complete set of
            the flow''s steps — any existing step not included here is deleted. Omit the field entirely
            to leave steps untouched. Each step''s own `conditions` field follows the same rule at the
            step level: omitted preserves the existing conditions on that step, while `[]` deletes all
            of that step''s conditions.'
        transitionFunctions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              code:
                type: string
              description:
                type: string
              parameters:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                    description:
                      type: string
                  required:
                  - id
                  - name
                  - type
                  additionalProperties: false
              references:
                type: object
                properties:
                  flowSteps:
                    type: object
                    additionalProperties:
                      type: boolean
                  variables:
                    type: object
                    additionalProperties:
                      type: boolean
                additionalProperties: false
            required:
            - id
            - name
            - code
            additionalProperties: false
          description: 'Full replace semantics: when provided, this array becomes the complete set of
            the flow''s transition functions — any existing transition function not included here is deleted.
            Omit the field entirely to leave transition functions untouched.'
      additionalProperties: false
      title: UpdateFlowPublicBody
    UpdateFunctionPublicBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        code:
          type: string
        parameters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              description:
                type: string
              type:
                type: string
                enum:
                - string
                - number
                - boolean
                - integer
            required:
            - name
            - description
            - type
            additionalProperties: false
        latencyControl:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            randomize:
              type: boolean
              default: false
            initialDelay:
              type: number
              default: 0
            interval:
              type: number
              default: 0
            delayResponses:
              type: array
              items:
                type: object
                properties:
                  message:
                    type: string
                  duration:
                    type: number
                required:
                - message
                - duration
                additionalProperties: false
              default: []
          additionalProperties: false
        force:
          type: boolean
      additionalProperties: false
      description: Partial update to a custom function.
      title: UpdateFunctionPublicBody
    UpdateKnowledgeBaseTopicBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        content:
          type: string
        actions:
          type: string
        exampleQueries:
          type: object
          properties:
            queries:
              type: array
              items:
                type: string
              maxItems: 100
          required:
          - queries
          additionalProperties: false
        isActive:
          type: boolean
      additionalProperties: false
      description: Partial update to a knowledge base topic.
      title: UpdateKnowledgeBaseTopicBody
    UpdateMcpServerBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        auth:
          type: object
          properties:
            header:
              type: string
            queryParam:
              type: string
            oauth:
              type: object
              properties:
                clientId:
                  type: string
                clientSecretName:
                  type: string
                tokenUrl:
                  type: string
                audience:
                  type: string
                scope:
                  type: string
              required:
              - clientId
              - tokenUrl
              additionalProperties: false
            secretName:
              type: string
          additionalProperties: false
        timeout:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 30
      additionalProperties: false
      description: Partial update to an existing MCP server connection.
      title: UpdateMcpServerBody
    UpdateProjectVoiceRequest:
      description: The voice to set as the project's active default voice.
      type: object
      properties:
        voiceId:
          description: Voice ID to set as the project voice
          type: string
      required:
      - voiceId
    UpdateSecretBody:
      description: Fields to update on an existing secret.
      type: object
      properties:
        value:
          description: New secret value
          minLength: 1
          type: string
        description:
          description: Description of the secret (unchanged if omitted)
          type:
          - string
          - 'null'
      required:
      - value
    UpdateSpecialFunctionPublicBody:
      type: object
      properties:
        code:
          type: string
          minLength: 1
      required:
      - code
      additionalProperties: false
      description: New code for a branch's start or end special function.
      title: UpdateSpecialFunctionPublicBody
    UpdateVariantBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        attributeValues:
          type: object
          properties:
            values:
              type: object
              additionalProperties:
                type: string
              default: {}
            typedValues:
              type: object
              additionalProperties: {}
              description: Native-typed values (number, boolean, enum, or object), keyed by attribute
                id. When set for an attribute, takes precedence over the corresponding entry in `values`
                for that attribute — it must match the attribute’s declared type.
          additionalProperties: false
        isDefault:
          type: boolean
      additionalProperties: false
      description: Partial update to a variant.
      title: UpdateVariantBody
    UpdateVoiceRequest:
      description: 'Partial update to a voice in the library.


        All fields are optional — only provided fields are patched.'
      type: object
      properties:
        name:
          description: Human-readable voice name
          type:
          - string
          - 'null'
        provider:
          description: TTS provider
          type:
          - string
          - 'null'
        config:
          description: Provider-specific voice config
          type:
          - object
          - 'null'
        providerVoiceId:
          description: Voice ID from the TTS provider
          type:
          - string
          - 'null'
        voiceMetadata:
          description: Additional voice metadata
          type:
          - object
          - 'null'
    UpsertDeployedVoiceRequest:
      description: 'A voice and traffic weight to deploy on the project; provide an id to

        update an existing deployed voice instead of creating a new one.'
      type: object
      properties:
        voiceId:
          description: Voice ID to deploy
          type: string
        probability:
          description: Traffic weight (0.0–1.0)
          type: number
        id:
          description: Deployed voice ID — omit to create, provide to update
          type:
          - string
          - 'null'
      required:
      - voiceId
      - probability
    UpsertNoteBody:
      description: A freeform note to set on a conversation, replacing any existing note.
      type: object
      properties:
        note:
          type: string
      required:
      - note
    ValidateFunctionsPublicResponse:
      type: object
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - syntax_error
                - orphaned_reference
              functionId:
                type: string
                nullable: true
              functionName:
                type: string
                nullable: true
              detail:
                type: string
                nullable: true
              errors:
                type: array
                items:
                  type: object
                  properties:
                    lineno:
                      type: number
                    message:
                      type: string
                    text:
                      type: string
                  required:
                  - lineno
                  - message
                  additionalProperties: false
            required:
            - type
            - functionId
            - functionName
            - detail
            additionalProperties: false
      required:
      - valid
      - issues
      additionalProperties: false
      description: The result of validating every function on a branch, including any syntax or reference
        issues found.
      title: ValidateFunctionsPublicResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VariantResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        attributeValues:
          type: object
          properties:
            values:
              type: object
              additionalProperties:
                type: string
            typedValues:
              type: object
              additionalProperties: {}
              description: Map of attribute ID to the natively-typed value (number, boolean, enum, or
                object), when set.
          required:
          - values
          additionalProperties: false
      required:
      - id
      - name
      - isDefault
      - attributeValues
      additionalProperties: false
      description: A variant of an agent's configuration, defined by its attribute-value overrides.
      title: VariantResponse
    VoiceResponse:
      description: A single voice as returned by the public API.
      type: object
      properties:
        id:
          description: Unique voice identifier
          type: string
        name:
          description: Human-readable voice name
          type: string
        provider:
          description: TTS provider
          type: string
        providerVoiceId:
          description: Voice ID from the TTS provider
          type: string
        config:
          description: Provider-specific voice config
          type: object
        metadata:
          description: Additional voice metadata
          type:
          - object
          - 'null'
        isPolyVoice:
          description: True if this is a Poly-curated voice (vs account-owned)
          default: false
          type: boolean
      required:
      - id
      - name
      - provider
      - providerVoiceId
      - config
    VoiceSampleResponse:
      description: 'A short synthesized audio sample of a voice, with a time-limited URL

        to fetch it.'
      type: object
      properties:
        voiceId:
          description: The voice that was synthesized
          type: string
        sampleUrl:
          description: Time-limited URL to a synthesized sample of the voice
          type: string
        expiresInSeconds:
          description: Number of seconds until sample_url expires
          type: integer
        text:
          description: The text that was synthesized
          type: string
      required:
      - voiceId
      - sampleUrl
      - expiresInSeconds
      - text
    VoiceTuningConfig:
      description: Provider-specific voice tuning settings. All fields are optional — each TTS provider
        uses a different subset.
      type: object
      properties:
        stability:
          description: Controls voice consistency between regenerations (ElevenLabs)
          type:
          - number
          - 'null'
        similarityBoost:
          description: Controls how closely the output matches the original voice sample (ElevenLabs)
          type:
          - number
          - 'null'
        speed:
          description: Playback speed multiplier. 1.0 is normal speed
          type:
          - number
          - 'null'
        modelId:
          description: TTS model ID, specific to the provider (e.g. 'eleven_turbo_v2')
          type:
          - string
          - 'null'
        engine:
          description: TTS engine identifier
          type:
          - string
          - 'null'
        emotion:
          description: Emotion preset for the voice (Cartesia)
          type:
          - string
          - 'null'
        volume:
          description: Output volume level (Cartesia)
          type:
          - number
          - 'null'
        version:
          description: Model version
          type:
          - string
          - 'null'
        voiceDescription:
          description: Natural language voice description (Hume)
          type:
          - string
          - 'null'
        instantMode:
          description: Enable instant mode for lower latency (Hume)
          type:
          - boolean
          - 'null'
    WindowDuration:
      enum:
      - 5m
      - 10m
      - 60m
      title: WindowDuration
      description: Window duration enum
paths:
  /v1/accounts/{accountId}/agents:
    get:
      x-spec-group: agents
      responses:
        '200':
          description: List of agents for the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentsResponse'
      summary: List agents
      description: List all agents in an account. Use this first to discover agent IDs before calling
        any agent-scoped endpoint.
      tags:
      - Agents
      x-mcp-tool: list-agents
      x-mcp-service: sourcerer
      x-mcp-route: /mcp-api/builder/sourcerer/v1/accounts/{accountId}/agents
    post:
      x-spec-group: agents
      responses:
        '200':
          description: Created agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentResponse'
      summary: Create agent
      description: Create a new voice agent. Requires a name and response settings (greeting and language).
        Returns the new agent ID.
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentBody'
      x-mcp-tool: create-agent
      x-mcp-service: sourcerer
      x-mcp-route: /mcp-api/builder/sourcerer/v1/accounts/{accountId}/agents
    parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
  /v1/accounts/{accountId}/voice-library:
    get:
      x-spec-group: agents
      summary: List all voices in the account's voice library
      description: List all voices available in the account's voice library.
      tags:
      - Voice Library
      parameters:
      - name: language
        in: query
        required: false
        schema:
          type: string
        description: Filter by voice metadata language, e.g. 'en-US'
      - name: gender
        in: query
        required: false
        schema:
          enum:
          - male
          - female
          - neutral
          type: string
        description: Filter by voice metadata gender
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: Filter by TTS provider, e.g. 'GOOGLE', 'ELEVENLABS'
      - name: isPolyVoice
        in: query
        required: false
        schema:
          type: boolean
        description: If set, restrict to (or exclude) Poly's curated voices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVoicesResponse'
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
        '404':
          description: Resource not found
      x-mcp-tool: list-all-voices-in-the-account-s-voice-library
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/accounts/{accountId}/voice-library
    post:
      x-spec-group: agents
      summary: Register a new voice in the voice library
      description: Register a new voice (e.g. a 3rd-party provider voice) in the library.
      tags:
      - Voice Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoiceResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
        '404':
          description: Resource not found
      x-mcp-tool: register-a-new-voice-in-the-voice-library
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/accounts/{accountId}/voice-library
    parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
  /v1/accounts/{accountId}/voice-library/{voiceId}:
    get:
      x-spec-group: agents
      summary: Get a single voice from the voice library
      description: Get detailed metadata for a single voice.
      tags:
      - Voice Library
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoiceResponse'
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
        '404':
          description: Resource not found
      x-mcp-tool: get-a-single-voice-from-the-voice-library
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/accounts/{accountId}/voice-library/{voiceId}
    patch:
      x-spec-group: agents
      summary: Update a voice in the voice library
      description: Partially update a voice's fields.
      tags:
      - Voice Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoiceRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoiceResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
        '404':
          description: Resource not found
      x-mcp-tool: update-a-voice-in-the-voice-library
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/accounts/{accountId}/voice-library/{voiceId}
    parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
    - name: voiceId
      in: path
      required: true
      schema:
        type: string
  /v1/accounts/{accountId}/voice-library/{voiceId}/sample:
    get:
      x-spec-group: agents
      summary: Synthesize a short audio sample of a voice
      description: Synthesize a fixed sample sentence using the voice and return its URL.
      tags:
      - Voice Library
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSampleResponse'
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
        '404':
          description: Resource not found
      x-mcp-tool: synthesize-a-short-audio-sample-of-a-voice
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/accounts/{accountId}/voice-library/{voiceId}/sample
    parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
    - name: voiceId
      in: path
      required: true
      schema:
        type: string
  /v1/agents/{agentId}:
    delete:
      x-spec-group: agents
      responses:
        '204':
          description: Agent deleted
      summary: Delete agent
      description: Permanently delete an agent and all its configuration. This cannot be undone — duplicate
        the agent first to back it up if needed.
      tags:
      - Agents
      x-mcp-tool: delete-agent
      x-mcp-service: sourcerer
      x-mcp-route: /mcp-api/builder/sourcerer/v1/agents/{agentId}
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: string
  /v1/agents/{agentId}/audio-cache:
    get:
      x-spec-group: agents
      summary: List audio cache entries
      description: List cached TTS audio entries for an agent with metadata including transcript, provider,
        voice, duration, and hit count. Supports pagination, sorting, and filtering.
      tags:
      - Audio Cache
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        description: Max entries to return (1-200)
      - name: offset
        in: query
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        description: Pagination offset
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Sort expression, e.g. "hit_count:desc", "duration:asc"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAudioCacheResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
      x-mcp-tool: list-audio-cache-entries
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/agents/{agentId}/audio-cache
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: string
  /v1/agents/{agentId}/audio-cache/bulk-delete:
    post:
      x-spec-group: agents
      summary: Bulk delete audio cache entries
      description: Delete multiple audio cache entries by ID in a single request. Operates best-effort
        — returns which IDs were successfully deleted and which failed, so partial failures can be retried.
        Maximum 100 IDs per request.
      tags:
      - Audio Cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized – missing or invalid API key
        '403':
          description: Forbidden – insufficient permissions
      x-mcp-tool: bulk-delete-audio-cache-entries
      x-mcp-service: jupiter-api
      x-mcp-route: /mcp-api/builder/jupiter-api/v1/agents/{agentId}/audio-cache/bulk-delete
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: string
  /v1/agents/{agentId}/audio-cache/{entryId}:
    delete:
      x-spec-group: agents
      summary: Delete audio cache entry
      description: Delete a cached audio entry and its associated audio file from storage. The entry is
